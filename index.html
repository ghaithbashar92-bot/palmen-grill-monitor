<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PALMO CHICKEN</title>

<style>

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#fff;
overflow:hidden;
}

/* ===== TV ===== */

#display{
display:none;
width:100vw;
height:100vh;
background:#111;
}

/* ===== LOGO ===== */

.logo{
height:18vh;
display:flex;
align-items:center;
justify-content:center;
background:#111;
padding:8px;
}

.logo img{
max-width:70%;
max-height:100%;
object-fit:contain;
}

/* ===== TWO SIDES ===== */

.grid{
display:flex;
width:100%;
height:82vh;
gap:4px;
padding:4px;
}

.box{
width:50%;
height:100%;
background:#1b1b1b;
overflow:hidden;
}

.title{
height:7vh;
min-height:45px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
}

.prep .title{
background:#526da6;
}

.ready .title{
background:#00b96b;
}

.orders{
padding-top:10px;
width:100%;
}

.num{
width:100%;
height:7vh;
min-height:48px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
color:#fff;
}

.ready .num{
background:#15965f;
margin-bottom:4px;
}


/* ===== CONTROL ===== */

#control{
display:none;
min-height:100vh;
background:#111;
padding:15px;
overflow:auto;
}

.controls{
max-width:800px;
margin:auto;
}

.card{
background:#1b1b1b;
padding:16px;
border-radius:12px;
margin-bottom:14px;
}

.card h2{
margin-top:0;
}

input{
font-size:28px;
padding:12px;
width:60%;
border:0;
border-radius:8px;
}

button{
font-size:18px;
font-weight:bold;
padding:12px 15px;
border:0;
border-radius:8px;
margin:4px;
}

.add{
background:#fff;
color:#111;
}

.readybtn{
background:#00a760;
color:#fff;
}

.done{
background:#555;
color:#fff;
}

.row{
background:#222;
padding:12px;
margin:8px 0;
border-radius:8px;
font-size:20px;
}

</style>
</head>


<body>


<!-- ===== TV ===== -->

<div id="display">

<div class="logo">
<img src="IMG_8751.jpeg" alt="PALMO CHICKEN">
</div>

<div class="grid">

<div class="box prep">

<div class="title">
IN ZUBEREITUNG
</div>

<div id="prep" class="orders"></div>

</div>


<div class="box ready">

<div class="title">
ABHOLBEREIT
</div>

<div id="ready" class="orders"></div>

</div>

</div>
</div>


<!-- ===== CONTROL ===== -->

<div id="control">

<div class="controls">

<div class="card">

<h2>Neue Bestellnummer</h2>

<input
id="number"
inputmode="numeric"
placeholder="z.B. 25">

<button class="add" onclick="addOrder()">
Hinzufügen
</button>

</div>


<div class="card">

<h2>Bestellungen</h2>

<div id="list"></div>

</div>

</div>
</div>


<script>

/* ===== FIREBASE ===== */

var DB =
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


/* ===== MODE ===== */

var query=window.location.search.substring(1);
var parts=query.split("&");
var mode="control";

for(var i=0;i<parts.length;i++){

var pair=parts[i].split("=");

if(pair[0]==="mode"){
mode=pair[1];
}

}

if(mode==="display"){

document.getElementById("display").style.display="block";

}else{

document.getElementById("control").style.display="block";

}


/* ===== REQUEST ===== */

function request(method,path,data,callback){

var xhr=new XMLHttpRequest();

xhr.open(
method,
DB+path+".json",
true
);

xhr.setRequestHeader(
"Content-Type",
"application/json"
);

xhr.onreadystatechange=function(){

if(xhr.readyState===4){

var result=null;

try{
result=JSON.parse(xhr.responseText);
}catch(e){}

if(callback){
callback(result);
}

}

};

if(data===null || data===undefined){
xhr.send();
}else{
xhr.send(JSON.stringify(data));
}

}


/* ==================================
   ADD ORDER + منع إضافة رقم مكرر
================================== */

function addOrder(){

var input=document.getElementById("number");

var number=input.value.replace(/\D/g,"");

if(!number)return;

request(
"GET",
"/orders",
null,
function(data){

data=data || {};

var keys=Object.keys(data);
var duplicate=false;

for(var i=0;i<keys.length;i++){

var order=data[keys[i]];

if(
order &&
String(order.number).trim() ===
String(number).trim()
){

duplicate=true;
break;

}

}


/* الرقم موجود */

if(duplicate){

alert(
"Nummer "+number+" ist bereits vorhanden."
);

input.value="";

return;

}


/* الرقم غير موجود */

request(
"POST",
"/orders",
{
number:number,
status:"preparing",
createdAt:Date.now()
},
function(){

input.value="";

}
);

}
);

}


/* ===== READY ===== */

function setReady(key){

request(
"PATCH",
"/orders/"+key,
{
status:"ready",
readyAt:Date.now()
}
);

}


/* ===== DELETE ===== */

function removeOrder(key){

request(
"DELETE",
"/orders/"+key,
null
);

}


/* ==================================
   RENDER + إخفاء أي تكرار قديم
================================== */

function render(data){

data=data || {};

var prep="";
var ready="";
var list="";

/* نخزن الأرقام التي ظهرت */
var seen={};

var keys=Object.keys(data);

keys.sort(function(a,b){

return (data[a].createdAt || 0) -
       (data[b].createdAt || 0);

});


for(var i=0;i<keys.length;i++){

var key=keys[i];
var order=data[key];

if(!order){
continue;
}

if(order.number===undefined){
continue;
}

var number=
String(order.number).trim();


/* ===== إذا ظهر الرقم سابقاً تجاهله ===== */

if(seen[number]){
continue;
}

seen[number]=true;


/* ===== READY ===== */

if(order.status==="ready"){

ready +=
'<div class="num">'+
number+
'</div>';

list +=
'<div class="row">'+
'<b>'+number+'</b> — ABHOLBEREIT '+
'<button class="done" onclick="removeOrder(\''+
key+
'\')">Abgeholt</button>'+
'</div>';

}


/* ===== PREPARING ===== */

else{

prep +=
'<div class="num">'+
number+
'</div>';

list +=
'<div class="row">'+
'<b>'+number+'</b> — IN ZUBEREITUNG '+
'<button class="readybtn" onclick="setReady(\''+
key+
'\')">Fertig</button>'+
'</div>';

}

}


/* ===== DISPLAY ===== */

if(mode==="display"){

document.getElementById("prep").innerHTML=prep;

document.getElementById("ready").innerHTML=ready;

}


/* ===== CONTROL ===== */

else{

document.getElementById("list").innerHTML=
list || "Keine Bestellungen";

}

}


/* ===== AUTO UPDATE ===== */

function poll(){

request(
"GET",
"/orders",
null,
function(data){

render(data);

setTimeout(
poll,
1000
);

}
);

}

poll();

</script>

</body>
</html>

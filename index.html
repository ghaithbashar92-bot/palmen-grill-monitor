<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PALMO CHICKEN</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;
}

/* ===== الشاشة ===== */

.screen{
position:relative;
width:100vw;
height:100vh;

/* الصورة فقط */
background-image:url("IMG_8709.jpeg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* ===== منطقة الأرقام ===== */

.numbers-area{
position:absolute;

/* مكان المربعات داخل الصورة */
left:21%;
right:21%;
top:42%;
bottom:18%;

display:flex;
gap:2%;
}

/* ===== اليسار واليمن ===== */

.side{
width:50%;
height:100%;
overflow:hidden;
}

.orders{
width:100%;
display:flex;
flex-wrap:wrap;
align-content:flex-start;
padding:6px;
}

/* ===== الرقم ===== */

.num{
width:calc(25% - 8px);
height:70px;
margin:4px;

display:flex;
align-items:center;
justify-content:center;

font-size:38px;
font-weight:900;

color:white;
background:#202020;

border:1px solid #444;
border-radius:6px;
}

/* جاهز بدون وميض */

.ready .num{
background:#202020;
box-shadow:none;
animation:none;
}

</style>
</head>


<body>

<div class="screen">

    <!-- اليسار -->
    <div class="numbers-area">

        <div class="side preparing">
            <div id="prep" class="orders"></div>
        </div>

        <!-- اليمين -->
        <div class="side ready">
            <div id="ready" class="orders"></div>
        </div>

    </div>

</div>


<script>

/* أرقام تجريبية */

var preparingNumbers=[
"125","124","122","119",
"118","116","115","114",
"113","112","111","110"
];

var readyNumbers=[
"123","120","117","109"
];


function showNumbers(){

var prep="";
var ready="";

for(var i=0;i<preparingNumbers.length;i++){

prep +=
'<div class="num">'+
preparingNumbers[i]+
'</div>';

}

for(var i=0;i<readyNumbers.length;i++){

ready +=
'<div class="num">'+
readyNumbers[i]+
'</div>';

}

document.getElementById("prep").innerHTML=prep;
document.getElementById("ready").innerHTML=ready;

}

showNumbers();

</script>

</body>
</html>

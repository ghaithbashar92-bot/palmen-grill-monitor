<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN Monitor</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#080808;
color:#fff;
overflow:hidden;
}

#display{
display:none;
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:
repeating-conic-gradient(
#151515 0 25%,
#0b0b0b 0 50%
) 0 0/42px 42px;
}

/* ===== SIDE FOOD ===== */

.food{
position:absolute;
top:0;
bottom:0;
width:18%;
background-image:url("IMG_8709.png");
background-repeat:no-repeat;
background-size:auto 100%;
z-index:1;
pointer-events:none;
}

.food-left{
left:0;
background-position:left center;
}

.food-right{
right:0;
background-position:right center;
}

/* ===== CENTER AREA ===== */

.center-wrap{
position:relative;
z-index:3;
width:66%;
height:100vh;
margin:0 auto;
padding:18px 8px 12px;
display:flex;
flex-direction:column;
}

/* ===== LOGO ===== */

.logo-area{
height:17vh;
min-height:110px;
display:flex;
align-items:center;
justify-content:center;
padding:4px 10px 10px;
}

.logo-area img{
max-width:75%;
max-height:100%;
object-fit:contain;
display:block;
}

/* ===== ORDER PANELS ===== */

.panels{
flex:1;
display:flex;
gap:10px;
min-height:0;
}

.box{
position:relative;
width:50%;
height:100%;
background:rgba(15,15,15,.97);
border:1px solid #e51b23;
border-radius:11px;
overflow:hidden;
}

.box h2{
margin:0;
height:64px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:25px;
font-weight:900;
background:linear-gradient(#bd1017,#8b080d);
border-bottom:1px solid #e51b23;
}

.orders{
padding:10px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
align-content:start;
}

.num{
font-size:34px;
font-weight:900;
text-align:center;
background:#202020;
padding:15px 3px;
border-radius:6px;
border:1px solid #303030;
}

/* READY بدون وميض */

.ready .num{
background:#202020;
border:1px solid #303030;
box-shadow:none !important;
animation:none !important;
}

.footerText{
position:absolute;
bottom:10px;
left:10px;
right:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}

.footerText:before,
.footerText:after{
content:"";
height:2px;
background:#e51b23;
flex:1;
margin:0 8px;
}

/* ===== SOUND ===== */

.soundbtn{
position:absolute;
z-index:50;
top:8px;
right:8px;
background:#fff;
color:#111;
font-weight:bold;
font-size:13px;
padding:8px 10px;
border:0;
border-radius:8px;
}

/* ===== CONTROL ===== */

#control{
display:none;
min-height:100vh;
background:#111;
padding:15px;
overflow:auto;
}

.controls{
max-width:800px;
margin:auto;
}

.card{
background:#1b1b1b;
padding:16px;
border-radius:16px;
margin-bottom:14px;
}

.card h2{
margin-top:0;
}

input{
font-size:26px;
padding:12px;
width:65%;
}

button{
font-size:18px;
padding:12px 14px;
border:0;
border-radius:10px;
margin:4px;
}

.add{
background:#fff;
color:#111;
}

.readybtn{
background:#176a3b;
color:#fff;
}

.done{
background:#555;
color:#fff;
}

.row{
padding:10px;
background:#222;
margin:8px 0;
border-radius:10px;
}

/* ===== TV SMALLER ===== */

@media(max-width:1200px){

.center-wrap{
width:68%;
}

.food{
width:17%;
}

.logo-area{
height:16vh;
}

.box h2{
font-size:21px;
height:58px;
}

.num{
font-size:29px;
padding:13px 2px;
}

}
</style>
</head>

<body>

<div id="display">

<button
id="soundBtn"
class="soundbtn"
style="display:none"
onclick="enableSound()">
🔊 Ton aktivieren
</button>

<div class="food food-left"></div>
<div class="food food-right"></div>

<div class="center-wrap">

<div class="logo-area">
<img src="IMG_8708.png" alt="PALMO CHICKEN">
</div>

<div class="panels">

<div class="box prep">

<h2>🍲 &nbsp; IN ZUBEREITUNG</h2>

<div id="prep" class="orders"></div>

<div class="footerText">
VIELEN DANK, DASS DU HIER BIST
</div>

</div>

<div class="box ready">

<h2>🛍️ &nbsp; ABHOLBEREIT</h2>

<div id="ready" class="orders"></div>

<div class="footerText">
GUTEN APPETIT
</div>

</div>

</div>
</div>
</div>


<div id="control" class="controls">

<div class="card">

<h2>Neue Bestellnummer</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125">

<button
class="add"
onclick="addOrder()">
Hinzufügen
</button>

</div>

<div class="card">

<h2>Aktuelle Bestellungen</h2>

<div id="list"></div>

</div>

</div>


<script>

var DB=
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";

function getParameter(name){

var query=window.location.search.substring(1);
var vars=query.split("&");

for(var i=0;i<vars.length;i++){

var pair=vars[i].split("=");

if(pair[0]===name){
return decodeURIComponent(pair[1]||"");
}

}

return null;
}

var mode=getParameter("mode")||"control";

document.getElementById(
mode==="display" ? "display" : "control"
).style.display="block";


/* ===== SOUND ===== */

var soundEnabled=false;
var previousReady={};
var firstLoad=true;
var audioPlayer=null;

if(mode==="display"){
document.getElementById("soundBtn").style.display="block";
}

function enableSound(){

soundEnabled=true;

document.getElementById("soundBtn").innerHTML=
"🔊 Ton aktiv";

beep();

setTimeout(function(){
speak("Ton ist aktiviert");
},500);

}

function speak(text){

if(!soundEnabled)return;

try{

var url=
"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="
+encodeURIComponent(text);

audioPlayer=new Audio(url);
audioPlayer.volume=1;

var p=audioPlayer.play();

if(p && p.catch){
p.catch(function(){
beep();
});
}

audioPlayer.onerror=function(){
beep();
};

}catch(e){
beep();
}

}

function beep(){

try{

var AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

var ctx=new AC();
var osc=ctx.createOscillator();
var gain=ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value=880;
gain.gain.value=0.5;

osc.start();

setTimeout(function(){

try{
osc.stop();
ctx.close();
}catch(e){}

},500);

}catch(e){}

}


/* ===== REQUEST ===== */

function req(method,path,data,cb){

var x=new XMLHttpRequest();

x.open(
method,
DB+path+".json",
true
);

x.setRequestHeader(
"Content-Type",
"application/json"
);

x.onreadystatechange=function(){

if(x.readyState===4 && cb){

var r=null;

try{
r=JSON.parse(x.responseText);
}catch(e){}

cb(r);

}

};

x.send(
data===null || data===undefined
? null
: JSON.stringify(data)
);

}


/* ===== ADD ORDER ===== */

function addOrder(){

var input=document.getElementById("n");

var n=input.value.replace(/\D/g,"");

if(!n)return;

req(
"GET",
"/orders",
null,
function(data){

data=data||{};

var duplicate=false;

Object.keys(data).forEach(function(k){

if(
String(data[k].number)===
String(n)
){
duplicate=true;
}

});

if(duplicate){

alert(
"Nummer "+n+
" ist bereits vorhanden."
);

return;
}

req(
"POST",
"/orders",
{
number:n,
status:"preparing",
createdAt:Date.now()
},
function(){
input.value="";
}
);

}
);

}


/* ===== READY ===== */

function setReady(k){

req(
"PATCH",
"/orders/"+k,
{
status:"ready",
readyAt:Date.now()
}
);

}


/* ===== REMOVE ===== */

function removeOrder(k){

req(
"DELETE",
"/orders/"+k
);

}


/* ===== RENDER ===== */

function render(data){

data=data||{};

var prep="";
var ready="";
var list="";
var currentReady={};

Object.keys(data).forEach(function(k){

var o=data[k];

if(o.status==="ready"){

ready+=
'<div class="num">'+
o.number+
'</div>';

list+=
'<div class="row">'+
'<b>'+o.number+'</b> '+
'ABHOLBEREIT '+
'<button class="done" '+
'onclick="removeOrder(\''+
k+
'\')">Abgeholt</button>'+
'</div>';

currentReady[k]=true;

if(
mode==="display" &&
!firstLoad &&
!previousReady[k]
){

speak(
"Nummer "+
o.number+
", bitte!"
);

}

}else{

prep+=
'<div class="num">'+
o.number+
'</div>';

list+=
'<div class="row">'+
'<b>'+o.number+'</b> '+
'IN ZUBEREITUNG '+
'<button class="readybtn" '+
'onclick="setReady(\''+
k+
'\')">Fertig</button>'+
'</div>';

}

});

previousReady=currentReady;
firstLoad=false;

if(mode==="display"){

document.getElementById("prep").innerHTML=
prep||"";

document.getElementById("ready").innerHTML=
ready||"";

}else{

document.getElementById("list").innerHTML=
list||"Keine Bestellungen";

}

}


/* ===== AUTO UPDATE ===== */

function poll(){

req(
"GET",
"/orders",
null,
function(d){

render(d);

setTimeout(
poll,
1000
);

}
);

}

poll();

</script>

</body>
</html>

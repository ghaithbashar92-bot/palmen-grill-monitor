<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN Monitor</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#090909;
color:#fff;
overflow:hidden;
}

/* ===== TOP BAR ===== */

header{
height:12vh;
min-height:75px;
background:#0d0d0d;
display:flex;
align-items:center;
justify-content:center;
position:relative;
border-bottom:2px solid #333;
z-index:10;
}

.brand{
text-align:center;
font-weight:bold;
line-height:1;
}

.brand-main{
font-size:42px;
font-weight:900;
letter-spacing:-1px;
}

.brand-palmo{
color:#fff;
}

.brand-chicken{
color:#e51b23;
}

.brand-sub{
font-size:14px;
font-weight:normal;
margin-top:5px;
color:#fff;
}

/* ===== SOUND BUTTON ===== */

.soundbtn{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
background:#fff;
color:#111;
font-weight:bold;
font-size:15px;
padding:10px 13px;
border:0;
border-radius:10px;
}

/* ===== DISPLAY ===== */

.wrap{
padding:0;
}

#display{
position:relative;
width:100%;
height:88vh;
overflow:hidden;
background:
linear-gradient(
rgba(0,0,0,.18),
rgba(0,0,0,.18)
),
repeating-conic-gradient(
#151515 0 25%,
#0e0e0e 0 50%
) 0 0 / 42px 42px;
}

/* ===== FOOD IMAGES ===== */

.food{
position:absolute;
top:0;
bottom:0;
width:19%;
z-index:1;
background-repeat:no-repeat;
background-size:cover;
pointer-events:none;
}

.food-left{
left:0;
background-position:center center;

/*
صورة البرغر راح تكون هنا
بالجزء الثاني
*/
}

.food-right{
right:0;
background-position:center center;

/*
صورة الدجاج راح تكون هنا
بالجزء الثالث
*/
}

/* ===== CENTER ORDER AREA ===== */

.grid{
position:relative;
z-index:3;
display:flex;
width:64%;
height:84vh;
margin:0 auto;
padding-top:20px;
gap:10px;
}

.box{
width:50%;
height:100%;
background:rgba(20,20,20,.96);
border:1px solid #e31b23;
border-radius:12px;
overflow:hidden;
}

.box h2{
margin:0;
height:72px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:27px;
font-weight:800;
letter-spacing:.3px;
}

/* ===== PREPARING ===== */

.prep h2{
background:linear-gradient(
#ba0e15,
#8d080d
);
}

/* ===== READY ===== */

.ready h2{
background:linear-gradient(
#ba0e15,
#8d080d
);
}

/* ===== NUMBERS ===== */

.orders{
padding:12px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
align-content:start;
}

.num{
min-width:0;
font-size:38px;
font-weight:900;
text-align:center;
background:#202020;
padding:18px 4px;
border-radius:6px;
border:1px solid #292929;
box-shadow:none;
}

/*
مهم:
الأرقام الجاهزة ثابتة.
ماكو وميض وماكو Flash.
*/

.ready .num{
background:#202020;
border:1px solid #292929;
box-shadow:none;
animation:none !important;
}

/* ===== BOTTOM TEXT ===== */

.footerText{
position:absolute;
bottom:12px;
left:10px;
right:10px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:bold;
}

.footerText:before,
.footerText:after{
content:"";
height:2px;
background:#e51b23;
flex:1;
margin:0 12px;
}

.prep,
.ready{
position:relative;
}

/* ===== CONTROL PAGE ===== */

.controls{
max-width:800px;
margin:auto;
padding:10px;
overflow:auto;
height:100vh;
}

.card{
background:#1b1b1b;
padding:16px;
border-radius:16px;
margin-bottom:14px;
}

.card h2{
margin-top:0;
}

input{
font-size:26px;
padding:12px;
width:65%;
}

button{
font-size:18px;
padding:12px 14px;
border:0;
border-radius:10px;
margin:4px;
}

.add{
background:white;
color:#111;
}

.readybtn{
background:#176a3b;
color:white;
}

.done{
background:#555;
color:white;
}

.row{
padding:10px;
background:#222;
margin:8px 0;
border-radius:10px;
}

/* ===== SMALLER SCREENS ===== */

@media(max-width:1000px){

.brand-main{
font-size:34px;
}

.grid{
width:66%;
}

.food{
width:18%;
}

.box h2{
font-size:22px;
}

.num{
font-size:31px;
padding:16px 3px;
}

}

</style>
</head>

<body>

<header>

<div class="brand">
<div class="brand-main">
<span class="brand-palmo">PALMO</span>
<span class="brand-chicken"> CHICKEN</span>
</div>

<div class="brand-sub">
By Palmengrill
</div>
</div>

<button
id="soundBtn"
class="soundbtn"
style="display:none"
onclick="enableSound()">
🔊 Ton aktivieren
</button>

</header>

<div
id="display"
style="display:none"
>

<div class="food food-left"></div>

<div class="food food-right"></div>

<div class="grid">

<div class="box prep">

<h2>
🍲 &nbsp; IN ZUBEREITUNG
</h2>

<div
id="prep"
class="orders">
</div>

<div class="footerText">
VIELEN DANK, DASS DU HIER BIST
</div>

</div>

<div class="box ready">

<h2>
🛍️ &nbsp; ABHOLBEREIT
</h2>

<div
id="ready"
class="orders">
</div>

<div class="footerText">
GUTEN APPETIT
</div>

</div>

</div>
</div>
<!-- ===== CONTROL PANEL ===== -->

<div
id="control"
class="wrap controls"
style="display:none"
>

<div class="card">

<h2>Neue Bestellnummer</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125">

<button
class="add"
onclick="addOrder()">
Hinzufügen
</button>

</div>


<div class="card">

<h2>Aktuelle Bestellungen</h2>

<div id="list"></div>

</div>

</div>


<script>

/* ===== FIREBASE ===== */

var DB =
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


/* ===== DISPLAY / CONTROL MODE ===== */

function getParameter(name){

var query =
window.location.search.substring(1);

var vars =
query.split("&");

for(var i=0;i<vars.length;i++){

var pair =
vars[i].split("=");

if(pair[0]===name){

return decodeURIComponent(
pair[1] || ""
);

}

}

return null;

}


var mode =
getParameter("mode") || "control";


document
.getElementById(
mode==="display"
? "display"
: "control"
)
.style.display="block";


/* ===== SOUND ===== */

var soundEnabled=false;

var previousReady={};

var firstLoad=true;

var audioPlayer=null;


if(mode==="display"){

document
.getElementById("soundBtn")
.style.display="inline-block";

}


function enableSound(){

soundEnabled=true;

document
.getElementById("soundBtn")
.innerHTML="🔊 Ton aktiv";

/* Samsung TV sound unlock */

beep();

setTimeout(function(){

speak("Ton ist aktiviert");

},500);

}


function speak(text){

if(!soundEnabled)return;

try{

var url =
"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="
+
encodeURIComponent(text);


audioPlayer =
new Audio(url);

audioPlayer.volume=1;


var p =
audioPlayer.play();


if(p && p.catch){

p.catch(function(){

beep();

});

}


audioPlayer.onerror=function(){

beep();

};


}catch(e){

beep();

}

}


function beep(){

try{

var AC =
window.AudioContext ||
window.webkitAudioContext;


if(!AC)return;


var ctx =
new AC();


var osc =
ctx.createOscillator();


var gain =
ctx.createGain();


osc.connect(gain);

gain.connect(
ctx.destination
);


osc.frequency.value=880;

gain.gain.value=0.5;


osc.start();


setTimeout(function(){

try{

osc.stop();

ctx.close();

}catch(e){}

},500);


}catch(e){}

}


/* ===== FIREBASE REQUEST ===== */

function req(
method,
path,
data,
cb
){

var x =
new XMLHttpRequest();


x.open(
method,
DB+path+".json",
true
);


x.setRequestHeader(
"Content-Type",
"application/json"
);


x.onreadystatechange=function(){

if(
x.readyState===4 &&
cb
){

var r=null;

try{

r=
JSON.parse(
x.responseText
);

}catch(e){}


cb(r);

}

};


x.send(

data===null ||
data===undefined

? null

: JSON.stringify(data)

);

}


/* ===== ADD ORDER ===== */

function addOrder(){

var input =
document.getElementById("n");


var n =
input.value.replace(
/\D/g,
""
);


if(!n)return;


req(
"GET",
"/orders",
null,
function(data){

data=data||{};


var duplicate=false;


Object.keys(data)
.forEach(function(k){

if(
String(data[k].number)
===
String(n)
){

duplicate=true;

}

});


if(duplicate){

alert(
"Nummer "+
n+
" ist bereits vorhanden."
);

return;

}


req(
"POST",
"/orders",
{

number:n,

status:"preparing",

createdAt:Date.now()

},

function(){

input.value="";

}

);

}

);

}
  </script>

</body>
</html>

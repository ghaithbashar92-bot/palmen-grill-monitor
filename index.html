<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;
}

/* الصورة الأصلية */
.screen{
position:relative;
width:100vw;
height:100vh;
background-image:url("IMG_8709.png");
background-repeat:no-repeat;
background-position:center;
background-size:cover;
}

/* منطقة الأرقام فوق المربعات الموجودة بالصورة */
.number-zone{
position:absolute;
left:20%;
right:20%;
top:43%;
height:35%;
display:flex;
gap:2%;
}

/* يسار + يمين */
.column{
width:50%;
height:100%;
padding:5px;
}

.orders{
display:flex;
flex-wrap:wrap;
align-content:flex-start;
width:100%;
}

/* الرقم */
.num{
width:calc(25% - 8px);
height:62px;
margin:4px;

display:flex;
align-items:center;
justify-content:center;

background:#202020;
color:#fff;

border:1px solid #333;
border-radius:5px;

font-size:31px;
font-weight:900;
}

/* الجاهز ثابت بدون وميض */
.ready .num{
animation:none;
box-shadow:none;
}

/* التلفزيونات العريضة */
@media (min-aspect-ratio:16/10){

.screen{
background-size:100% 100%;
}

.number-zone{
left:20%;
right:20%;
top:43%;
height:36%;
}

.num{
font-size:2.2vw;
height:9vh;
}

}
</style>
</head>

<body>

<div class="screen">

<div class="number-zone">

<!-- اليسار: قيد التحضير -->
<div class="column preparing">
<div id="prep" class="orders"></div>
</div>

<!-- اليمين: جاهز -->
<div class="column ready">
<div id="ready" class="orders"></div>
</div>

</div>

</div>

<script>

/* أرقام تجريبية */

var preparing=[
"125","126","127","128",
"129","130","131","132",
"133","134","135","136"
];

var ready=[
"121","122","123","124"
];

function render(){

var a="";
var b="";

for(var i=0;i<preparing.length;i++){
a+='<div class="num">'+preparing[i]+'</div>';
}

for(var i=0;i<ready.length;i++){
b+='<div class="num">'+ready[i]+'</div>';
}

document.getElementById("prep").innerHTML=a;
document.getElementById("ready").innerHTML=b;

}

render();

</script>

</body>
</html>
